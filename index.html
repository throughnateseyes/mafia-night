<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14100D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="A cabin, a cake, and a killer among us. Secret roles for Mafia, dealt by QR code." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Mafia Night</title>
  </head>
  <body>
    <!-- Shared filter: makes every ink line look drawn by hand. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
